# Weekly update PRs for the pinned GitHub Actions (they are pinned to commit SHAs), the Python requirements and the
# pnpm workspace. CI runs on each PR; nothing merges by itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /spendlens
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
