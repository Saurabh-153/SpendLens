name: CI

on:
  push:
  pull_request:

# Read-only token: CI only checks out and tests (actions are pinned to commit SHAs; Dependabot bumps them).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spendlens
          POSTGRES_PASSWORD: spendlens
          POSTGRES_DB: spendlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendlens -d spendlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r spendlens/requirements-dev.txt

      # Real mistakes only (pyflakes + syntax); see ruff.toml for what's allowed on purpose.
      - name: ruff
        run: python -m ruff check .

      # The suite seeds its own database (SPENDLENS_DB), so no data file is needed here.
      - name: pytest (SQLite)
        run: python -m pytest

      # The same suite on PostgreSQL: conftest rebuilds the schema there with Alembic.
      - name: pytest (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://spendlens:spendlens@localhost:5432/spendlens_test
        run: python -m pytest

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck
      - name: build
        run: pnpm run build
