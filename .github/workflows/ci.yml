name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r spendlens/requirements-dev.txt

      # The suite seeds its own database (SPENDLENS_DB), so no data file is needed here.
      - name: pytest
        run: python -m pytest

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck
      - name: build
        run: pnpm run build
