# Lint for real mistakes only: pyflakes (F) and statement/syntax errors (E4, E7, E9). The codebase's own idioms are
# allowed on purpose: lambdas bound to names (E731), `l` variables (E741), `a; b` one-liners (E702) and imports after
# sys.path setup (E402). Line length is not checked.
target-version = "py310"
extend-exclude = ["venv_expense", "artifacts"]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E702", "E731", "E741"]
